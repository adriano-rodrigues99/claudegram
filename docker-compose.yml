services:
  claudegram:
    build: .
    container_name: claudegram
    hostname: claudegram-vps
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Agent works inside the mounted workspace, never the container root
      WORKSPACE_DIR: /workspace
      BOT_MODE: prod
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: "2"
    volumes:
      # Cloned repos — named volume, survives any redeploy
      - claudegram-workspace:/workspace
      # Entire container home: .claude (login), .claudegram (bot state),
      # .gitconfig, .ssh, .aws, .config/gh — all persistent
      - claudegram-home:/root

volumes:
  claudegram-workspace:
  claudegram-home:
